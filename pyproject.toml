[project]
name = "deepsniffing"
version = "0.1.0"
description = "Predicting human odor profiles from SMILES strings via sequence-based deep learning for (MAI642-Deep Learning) group project"
authors = [
    { name = "Manos (suprch4rg3d)" },
    { name = "Konstantin (kkraso01)" },
    { name = "Anastasia (akyria25)" },
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "rdkit>=2023.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
]

[project.scripts]
# Data acquisition and preprocessing
ds-prepare = "scripts.data.prepare_data:main"
ds-build = "scripts.preprocessing.enrich_molecules:main"
ds-inspect = "scripts.preprocessing.dataset_inspector:main"
# Training and evaluation
ds-train = "scripts.core.train:main"
ds-plot = "scripts.core.plots:main"
ds-predict = "scripts.training.predict:main"
ds-experiments = "scripts.training.run_experiments:main"

[tool.poetry]
# Console scripts require the project to be installable. Poetry installs it in
# editable mode, so the entry points below always run the working tree.
package-mode = true
packages = [{ include = "scripts" }]



[tool.poetry.group.dev.dependencies]
ruff = ">=0.17,<0.18"
pytest = ">=8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Safety (defaults) + import sorting, modern syntax, common bugs
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
