[project]
name = "deepsniffing"
version = "0.1.0"
description = "Writing molecules for a set of odor tokens with a small decoder-only transformer (MAI642-Deep Learning group project)"
authors = [
    { name = "Manos (suprch4rg3d)" },
    { name = "Konstantin (kkraso01)" },
    { name = "Anastasia (akyria25)" },
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "rdkit>=2023.9",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "simplemma (>=2.0.0,<3.0.0)",
    "selfies (>=2.2.0,<3.0.0)",
]

[project.scripts]
# Data acquisition and preprocessing
ds-prepare = "scripts.data.prepare_data:main"
ds-build = "scripts.preprocessing.build_odor:main"
# Training and evaluation
ds-train = "scripts.core.train:main"

[tool.poetry]
# Console scripts require the project to be installable. Poetry installs it in
# editable mode, so the entry points below always run the working tree.
package-mode = true
packages = [{ include = "scripts" }]



[tool.poetry.group.dev.dependencies]
ruff = ">=0.17,<0.18"
pytest = ">=8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# The Colab notebook is glue, and its code cells are kept free of blank lines on purpose, which the
# formatter and the import sorter both want to put back.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Safety (defaults) + import sorting, modern syntax, common bugs
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
